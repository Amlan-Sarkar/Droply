plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.droply.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.droply.app"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "1.3.6"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }

        python {
            version "3.11"
            def localPy = file("C:/Users/Amlon/AppData/Local/Programs/Python/Python311/python.exe")
            if (localPy.exists()) {
                buildPython localPy.absolutePath.replace('\\', '/')
            }
            pip {
                install "yt-dlp>=2024.8.6"
                install "requests>=2.31.0"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
            python.srcDirs = ['src/main/python']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.core:core:1.12.0'
}
