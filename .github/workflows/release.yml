name: Build and Publish Multi-Platform Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------- 1. DESKTOP BUILDS (Windows, macOS, Linux) ----------------
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Droply-Windows-x64.zip
            asset_path: Droply-Windows-x64.zip
          - os: macos-latest
            artifact_name: Droply-macOS.zip
            asset_path: Droply-macOS.zip
          - os: ubuntu-latest
            artifact_name: Droply-Linux-x86_64.tar.gz
            asset_path: Droply-Linux-x86_64.tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Standalone (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --name Droply --onedir --icon Droply.ico --add-data "web;web" --add-data "Droply.ico;." --hidden-import uvicorn.logging --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.lifespan.on app.py
          Compress-Archive -Path dist/Droply -DestinationPath Droply-Windows-x64.zip -Force

      - name: Build Standalone (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --name Droply --onedir --add-data "web:web" --hidden-import uvicorn.logging --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.lifespan.on app.py
          cd dist && zip -r ../Droply-macOS.zip Droply && cd ..

      - name: Build Standalone (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --name Droply --onedir --add-data "web:web" --hidden-import uvicorn.logging --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.lifespan.on app.py
          cd dist && tar -czf ../Droply-Linux-x86_64.tar.gz Droply && cd ..

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}

  # ---------------- 2. ANDROID STANDALONE APK BUILD ----------------
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Grant Execute Permissions to Gradle
        run: chmod +x android/gradlew

      - name: Prepare Web Assets for Android
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -r web/* android/app/src/main/assets/web/
          cp -r web/* android/app/src/main/assets/

      - name: Build Android APK with Gradle
        run: |
          cd android
          if command -v gradle &> /dev/null; then
            echo "Building with setup-gradle 8.5..."
            gradle assembleRelease --no-daemon
          else
            echo "Building with gradlew wrapper..."
            if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
              echo "Fetching gradle-wrapper.jar fallback..."
              mkdir -p gradle/wrapper
              curl -sSL --retry 5 --retry-delay 3 "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
            fi
            ./gradlew assembleRelease --no-daemon
          fi
          cd ..
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK found after build!"
            exit 1
          fi
          cp "$APK_FILE" Droply-Android.apk
          ls -lh Droply-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Droply-Android.apk
          path: Droply-Android.apk

  # ---------------- 3. iOS STANDALONE IPA BUILD ----------------
  build-ios:
    name: Build iOS (IPA Sideloadable)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Package Droply-iOS.ipa
        run: |
          cp -r web ios/web
          chmod +x ios/build_ipa.sh
          ./ios/build_ipa.sh
          cp ios/Droply-iOS.ipa ./Droply-iOS.ipa || true
          ls -lh Droply-iOS.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Droply-iOS.ipa
          path: Droply-iOS.ipa

  # ---------------- 4. PUBLISH ALL PLATFORMS TO GITHUB RELEASE ----------------
  publish-release:
    name: Publish Release Assets
    needs: [build-desktop, build-android, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download all compiled artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        run: ls -la release-assets

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: Droply ${{ github.ref_name }} - Universal Release (PC & Mobile)
          body: |
            ### 💻 PC / Desktop

            | Platform | Package | Direct Link |
            | :--- | :--- | :--- |
            | 🪟 **Windows** (Recommended) | Standalone ZIP | [Download for Windows (x64)](https://github.com/Amlan-Sarkar/Droply/releases/download/${{ github.ref_name }}/Droply-Windows-x64.zip) |
            | 🍎 **macOS** | Universal ZIP | [Download for macOS](https://github.com/Amlan-Sarkar/Droply/releases/download/${{ github.ref_name }}/Droply-macOS.zip) |
            | 🐧 **Linux** | x86_64 Archive | [Download for Linux](https://github.com/Amlan-Sarkar/Droply/releases/download/${{ github.ref_name }}/Droply-Linux-x86_64.tar.gz) |

            *No Python required. Extract and run directly.*

            ---

            ### 📱 Phone / Mobile

            | Platform | Package | Direct Link |
            | :--- | :--- | :--- |
            | 🤖 **Android** | Standalone APK | [Download for Android](https://github.com/Amlan-Sarkar/Droply/releases/download/${{ github.ref_name }}/Droply-Android.apk) |
            | 🍏 **iOS** | Sideloadable IPA | [Download for iOS](https://github.com/Amlan-Sarkar/Droply/releases/download/${{ github.ref_name }}/Droply-iOS.ipa) |

            *Runs locally on your phone. Saves media directly to storage & Photos.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
