buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://chaquo.com/maven" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath 'com.chaquo.python:gradle:15.0.1'
    }
}

// Workaround for Windows file locking / renameTo failure in Chaquopy
def chaquoPythonBuild = file("${rootDir}/app/build/python")
if (chaquoPythonBuild.exists()) {
    delete(chaquoPythonBuild)
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
    delete file("${rootDir}/app/build")
}
