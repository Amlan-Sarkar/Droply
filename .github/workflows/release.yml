name: Build and Publish Releases (Windows & Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.2.12)'
        required: false
        default: 'v1.2.12'

permissions:
  contents: write

jobs:
  # ---------------- 1. WINDOWS STANDALONE BUILD (STABLE) ----------------
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress

      - name: Configure Version Metadata
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag_name }}" } else { "${{ github.ref_name }}" }
          if (-not $tag -or $tag -eq "") { $tag = "v1.2.12" }
          $tagClean = $tag.TrimStart('v')
          Write-Host "Configuring Droply version: $tag (Clean: $tagClean)"
          Set-Content -Path VERSION -Value $tagClean
          "DROPLY_VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_VERSION_CLEAN=$tagClean" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Standalone (Windows)
        run: |
          pyinstaller --noconfirm --name Droply --onedir --windowed --noconsole --icon Droply.ico --add-data "web;web" --add-data "Droply.ico;." --add-data "VERSION;." --collect-all imageio_ffmpeg --collect-all pywebview --collect-all pythonnet --hidden-import uvicorn.logging --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.lifespan.on app.py
          New-Item -ItemType Directory -Force -Path dist/Droply/bin
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
            Copy-Item (Get-Command ffmpeg).Source -Destination dist/Droply/bin/ffmpeg.exe
          } else {
            python -c "import shutil, imageio_ffmpeg; shutil.copy(imageio_ffmpeg.get_ffmpeg_exe(), 'dist/Droply/bin/ffmpeg.exe')"
          }
          Copy-Item Droply.ico -Destination dist/Droply/Droply.ico -Force
          Copy-Item VERSION -Destination dist/Droply/VERSION -Force
          Compress-Archive -Path dist/Droply -DestinationPath Droply-Windows-x64.zip -Force

      - name: Build Inno Setup Windows Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc.exe).Source
          }
          Write-Host "Compiling Inno Setup using: $iscc with version: $env:RELEASE_VERSION_CLEAN"
          & $iscc "/DMyAppVersion=$env:RELEASE_VERSION_CLEAN" installer.iss
          if (-not (Test-Path "dist/Droply-Setup.exe")) {
            Write-Error "dist/Droply-Setup.exe was not created!"
            exit 1
          }
          Move-Item dist/Droply-Setup.exe Droply-Setup.exe -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Droply-Windows-Packages
          path: |
            Droply-Setup.exe
            Droply-Windows-x64.zip

  # ---------------- 2. ANDROID STANDALONE APK BUILD (EXPERIMENTAL) ----------------
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Grant Execute Permissions to Gradle
        run: chmod +x android/gradlew

      - name: Build Android APK with Gradle
        run: |
          cd android
          if command -v gradle &> /dev/null; then
            echo "Building with setup-gradle 8.5..."
            gradle assembleRelease --no-daemon
          else
            echo "Building with gradlew wrapper..."
            if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
              echo "Fetching gradle-wrapper.jar fallback..."
              mkdir -p gradle/wrapper
              curl -sSL --retry 5 --retry-delay 3 "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
            fi
            ./gradlew assembleRelease --no-daemon
          fi
          cd ..
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK found after build!"
            exit 1
          fi
          cp "$APK_FILE" Droply-Android.apk
          ls -lh Droply-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Droply-Android.apk
          path: Droply-Android.apk

  # ---------------- 3. PUBLISH TO GITHUB RELEASE ----------------
  publish-release:
    name: Publish Release Assets
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download all compiled artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        run: ls -la release-assets

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
            if [ -z "$TAG" ]; then TAG="v1.3.1"; fi
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: release-assets/*
          name: Droply ${{ steps.release_tag.outputs.tag }} - Windows & Android Release
          body: |
            ### 🚀 What's New in this Release:
            - **Refined Cat-Inspired Design:** Minimalist feline outline divider, sleeping kitten idle state in the downloader queue, and cleaned-up UI hints.
            - **Theme-Adaptive Interface:** Analyze button, update controls, and security badges automatically harmonize with your active color theme.
            - **Live Services Monitor:** Animated breathing pulse indicator displays real-time local background engine connectivity and status.
            - **Private by Design:** 100% on-device local processing with zero telemetry, zero analytics, and no external tracking.
            - **Core Engine Stability:** Embedded yt-dlp core engine update system with dynamic version detection and seamless restart installer.

            ---

            ### 🪟 Windows (Stable)

            | Platform | Package | Direct Link |
            | :--- | :--- | :--- |
            | 🪟 **Windows 10 / 11** | **Setup Wizard (Recommended)** | [Download Droply-Setup.exe](https://github.com/Amlan-Sarkar/Droply/releases/download/${{ steps.release_tag.outputs.tag }}/Droply-Setup.exe) |
            | 🪟 **Windows 10 / 11** | Standalone Portable ZIP | [Download Droply-Windows-x64.zip](https://github.com/Amlan-Sarkar/Droply/releases/download/${{ steps.release_tag.outputs.tag }}/Droply-Windows-x64.zip) |

            *Tested on Windows 11. Run `Droply-Setup.exe` for an effortless modern setup with Start Menu and Desktop shortcuts (no administrator rights needed). Or extract the portable zip and run `Droply.exe`.*

            ---

            ### 🤖 Android (Experimental)

            | Platform | Package | Direct Link |
            | :--- | :--- | :--- |
            | 🤖 **Android (7.0+)** | Standalone APK | [Download Droply-Android.apk](https://github.com/Amlan-Sarkar/Droply/releases/download/${{ steps.release_tag.outputs.tag }}/Droply-Android.apk) |

            > [!WARNING]
            > **Android is currently experimental:** The Android APK is provided for testing and community validation. Core download flows, storage paths, and UI interactions are under active development and may behave unexpectedly while mobile issues are being resolved.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
