name: Build and Publish Releases (Windows & Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------- 1. WINDOWS STANDALONE BUILD (STABLE) ----------------
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Standalone (Windows)
        run: |
          pyinstaller --noconfirm --name Droply --onedir --icon Droply.ico --add-data "web;web" --add-data "Droply.ico;." --hidden-import uvicorn.logging --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.lifespan.on app.py
          Compress-Archive -Path dist/Droply -DestinationPath Droply-Windows-x64.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Droply-Windows-x64.zip
          path: Droply-Windows-x64.zip

  # ---------------- 2. ANDROID STANDALONE APK BUILD (EXPERIMENTAL) ----------------
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Grant Execute Permissions to Gradle
        run: chmod +x android/gradlew

      - name: Prepare Web Assets for Android
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -r web/* android/app/src/main/assets/web/
          cp -r web/* android/app/src/main/assets/

      - name: Build Android APK with Gradle
        run: |
          cd android
          if command -v gradle &> /dev/null; then
            echo "Building with setup-gradle 8.5..."
            gradle assembleRelease --no-daemon
          else
            echo "Building with gradlew wrapper..."
            if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
              echo "Fetching gradle-wrapper.jar fallback..."
              mkdir -p gradle/wrapper
              curl -sSL --retry 5 --retry-delay 3 "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
            fi
            ./gradlew assembleRelease --no-daemon
          fi
          cd ..
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK found after build!"
            exit 1
          fi
          cp "$APK_FILE" Droply-Android.apk
          ls -lh Droply-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Droply-Android.apk
          path: Droply-Android.apk

  # ---------------- 3. PUBLISH TO GITHUB RELEASE ----------------
  publish-release:
    name: Publish Release Assets
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download all compiled artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        run: ls -la release-assets

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: Droply ${{ github.ref_name }} - Windows & Android Release
          body: |
            ### 🪟 Windows (Stable)

            | Platform | Package | Direct Link |
            | :--- | :--- | :--- |
            | 🪟 **Windows 10 / 11** | Standalone ZIP (x64) | [Download Droply-Windows-x64.zip](https://github.com/Amlan-Sarkar/Droply/releases/download/${{ github.ref_name }}/Droply-Windows-x64.zip) |

            *Tested on Windows 11. No Python required. Extract the zip and run `Droply.exe`.*

            ---

            ### 🤖 Android (Experimental)

            | Platform | Package | Direct Link |
            | :--- | :--- | :--- |
            | 🤖 **Android (7.0+)** | Standalone APK | [Download Droply-Android.apk](https://github.com/Amlan-Sarkar/Droply/releases/download/${{ github.ref_name }}/Droply-Android.apk) |

            > [!WARNING]
            > **Android is currently experimental:** The Android APK is provided for testing and community validation. Core download flows, storage paths, and UI interactions are under active development and may behave unexpectedly while mobile issues are being resolved.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
